name: CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Test portable engine
        run: uv run pytest -q

  macos-native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Native tests
        env:
          PHOTO_CURATOR_COREML_SWIFTC_OPTIMIZATION: -Onone
        run: uv run pytest -q
      - name: Production gallery benchmark
        run: make gallery-benchmark
      - name: Build and verify app and DMG
        run: |
          make app
          make verify-app
          make verify-dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-curator-native-evidence
          path: |
            build/evidence/*.json
            build/macos/PhotoCurator.dmg
          if-no-files-found: warn
