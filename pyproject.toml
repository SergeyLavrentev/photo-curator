[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-curator"
version = "0.1.0"
description = "Safe, local assisted photo culling for Apple Photos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "jinja2",
  "numpy",
  "osxphotos",
  "pillow",
  "python-multipart",
  "uvicorn",
]

[project.scripts]
photo-curator = "photo_curator.cli:main"

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-cov",
  "ruff",
]

# Compatibility with the uv version currently installed on the target Mac.
[tool.uv]
dev-dependencies = [
  "httpx",
  "pyinstaller>=6.14,<7",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/photo_curator"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
