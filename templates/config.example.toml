[server]
host = "127.0.0.1"
port = 0
open_browser = true

[paths]
# Defaults use ~/Library/Application Support, ~/Library/Caches and ~/Library/Logs.

[previews]
review_max_dimension = 2048
review_jpeg_quality = 88
thumbnail_max_dimension = 320
thumbnail_jpeg_quality = 75
analysis_max_dimension = 1024
settings_version = 1

[workers]
max_workers = 4
max_sips_processes = 2
batch_size = 24

[duplicates]
strict_phash_distance = 4
relaxed_phash_distance = 10
time_window_seconds = 120
aspect_ratio_tolerance = 0.08
histogram_similarity_strict = 0.90
leader_min_resolution_ratio = 0.75

[decisions]
auto_reject_render_equivalent_duplicates = true
auto_reject_high_confidence_near_duplicates = true
auto_reject_severe_blur = false
protect_favorites = true
protect_edited = true

[publish]
album_prefix = "PhotoCurator"
require_dry_run = true
block_resolution_inversion = true
